<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390"
     font-family="Georgia, 'Times New Roman', serif" role="img"
     aria-label="System architecture: the browser calls the frontend's own origin, which rewrites /api requests to the FastAPI backend, which loads the model artifact once at startup.">
  <title>System architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a0"/>
    </marker>
  </defs>

  <rect width="900" height="390" fill="#ffffff"/>

  <!-- ============ browser ============ -->
  <rect x="20" y="96" width="150" height="110" rx="3" fill="#E4EDF7" stroke="#30363d" stroke-width="1.2"/>
  <text x="95" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#161616">Browser</text>
  <text x="95" y="149" text-anchor="middle" font-size="12.5" fill="#444">Dashboard · Predict</text>
  <text x="95" y="167" text-anchor="middle" font-size="12.5" fill="#444">Result · Model info</text>
  <text x="95" y="190" text-anchor="middle" font-size="11.5" fill="#5c5c5c">React 19 + Vite</text>

  <!-- ============ vercel frontend ============ -->
  <rect x="235" y="56" width="250" height="190" rx="3" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/>
  <text x="360" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F5D8C">Vercel — frontend project</text>
  <text x="360" y="100" text-anchor="middle" font-size="11.5" fill="#5c5c5c">delinquency-risk.vercel.app</text>

  <rect x="255" y="114" width="210" height="52" rx="2" fill="#F6F7F8" stroke="#8a94a0" stroke-width="1"/>
  <text x="360" y="134" text-anchor="middle" font-size="12.5" fill="#161616">Static build (HTML/JS/CSS)</text>
  <text x="360" y="153" text-anchor="middle" font-size="11.5" fill="#5c5c5c">served from the CDN edge</text>

  <rect x="255" y="176" width="210" height="52" rx="2" fill="#FCF2D6" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#161616">rewrite rule</text>
  <text x="360" y="215" text-anchor="middle" font-size="12" fill="#161616">/api/* &#8594; backend</text>

  <!-- ============ fastapi backend ============ -->
  <rect x="550" y="56" width="250" height="190" rx="3" fill="#ffffff" stroke="#30363d" stroke-width="1.2"/>
  <text x="675" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2F5D8C">Vercel — backend project</text>
  <text x="675" y="100" text-anchor="middle" font-size="11.5" fill="#5c5c5c">loan-default-api.vercel.app</text>

  <rect x="570" y="114" width="210" height="52" rx="2" fill="#E2F2E7" stroke="#30363d" stroke-width="1"/>
  <text x="675" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#161616">FastAPI</text>
  <text x="675" y="153" text-anchor="middle" font-size="11.5" fill="#444">routes · Pydantic · predictor</text>

  <rect x="570" y="176" width="210" height="52" rx="2" fill="#F6F7F8" stroke="#8a94a0" stroke-width="1"/>
  <text x="675" y="196" text-anchor="middle" font-size="12" fill="#161616">loaded once at startup</text>
  <text x="675" y="214" text-anchor="middle" font-size="11.5" fill="#5c5c5c">never per request</text>

  <!-- ============ model artifact ============ -->
  <rect x="610" y="292" width="180" height="74" rx="3" fill="#FAE2E2" stroke="#B5483F" stroke-width="1.3"/>
  <text x="700" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#B5483F">model.joblib</text>
  <text x="700" y="335" text-anchor="middle" font-size="11.5" fill="#444">cleaner &#8594; imputer &#8594; forest</text>
  <text x="700" y="353" text-anchor="middle" font-size="11.5" fill="#5c5c5c">70 MB · trained offline</text>

  <!-- ============ arrows ============ -->
  <path d="M172 151 L233 151" stroke="#30363d" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="202" y="143" text-anchor="middle" font-size="11" fill="#5c5c5c">HTTPS</text>

  <path d="M487 202 L548 202" stroke="#30363d" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="517" y="194" text-anchor="middle" font-size="11" fill="#5c5c5c">server</text>
  <text x="517" y="218" text-anchor="middle" font-size="11" fill="#5c5c5c">side</text>

  <path d="M675 248 L675 290" stroke="#30363d" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ same-origin note ============ -->
  <rect x="20" y="292" width="560" height="74" rx="3" fill="#F6F7F8" stroke="#8a94a0" stroke-width="1"/>
  <text x="38" y="316" font-size="12.5" font-weight="bold" fill="#161616">Why there are no CORS errors</text>
  <text x="38" y="336" font-size="12" fill="#444">The browser only ever talks to one origin. It requests</text>
  <text x="38" y="354" font-size="12" fill="#444">
    <tspan font-family="Consolas, monospace" font-size="11.5">delinquency-risk.vercel.app/api/predict</tspan>; Vercel forwards it server-side.
  </text>

  <path d="M95 290 L95 210" stroke="#8a94a0" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowMuted)"/>
</svg>
